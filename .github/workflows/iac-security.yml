name: IaC Security Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policies/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'policies/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  TF_VERSION: '1.6.0'

jobs:
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    if: hashFiles('terraform/**/*.tf') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrew/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  tfsec:
    name: tfsec Security Scan
    runs-on: ubuntu-latest
    if: hashFiles('terraform/**/*.tf') != ''

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          format: sarif
          sarif_file: tfsec-results.sarif
          soft_fail: false

      - name: Upload tfsec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec

  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: hashFiles('terraform/**/*.tf') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive
        working-directory: terraform/

      - run: terraform init -backend=false
        working-directory: terraform/

      - run: terraform validate
        working-directory: terraform/

  opa:
    name: OPA Policy Evaluation
    runs-on: ubuntu-latest
    if: hashFiles('terraform/**/*.tf') != ''

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -backend=false
        working-directory: terraform/

      - run: terraform plan -out=tfplan
        working-directory: terraform/
        env:
          TF_VAR_db_password: dummy-for-ci

      - run: terraform show -json tfplan > tfplan.json
        working-directory: terraform/

      - uses: open-policy-agent/setup-opa@v2

      - name: Run OPA Policies
        run: |
          FAILED=0
          for policy in policies/opa/*.rego; do
            RESULT=$(opa eval --data "$policy" --input terraform/tfplan.json "data.terraform" --format json)
            DENIES=$(echo "$RESULT" | jq -r '.. | .deny? // empty | .[]' 2>/dev/null)
            if [ -n "$DENIES" ]; then
              echo "::error::Policy violations in $policy"
              echo "$DENIES"
              FAILED=1
            fi
          done
          exit $FAILED

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [checkov, tfsec, opa, validate]
    if: always()

    steps:
      - run: |
          echo "## IaC Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov | ${{ needs.checkov.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tfsec | ${{ needs.tfsec.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OPA Policies | ${{ needs.opa.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform Validate | ${{ needs.validate.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
